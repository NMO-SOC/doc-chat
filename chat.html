<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk to Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eeeee8;
  --ink:#15171a;
  --ink-soft:#4a4e55;
  --rule:#c9c9c0;
  --signal:#8c5a10;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#15171a;--ink:#ececE6;--ink-soft:#a4a8ad;--rule:#33363b;--signal:#d9a24a}
}
:root[data-theme="dark"]{--paper:#15171a;--ink:#ececE6;--ink-soft:#a4a8ad;--rule:#33363b;--signal:#d9a24a}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.6;
  display:flex;flex-direction:column;
}
header{
  max-width:44rem;width:100%;margin:0 auto;padding:1.5rem 1.25rem 0;
}
header p{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0;padding-bottom:1rem;border-bottom:1px solid var(--rule)}
header a{color:var(--signal)}
#log{
  flex:1;overflow-y:auto;max-width:44rem;width:100%;margin:0 auto;
  padding:1.5rem 1.25rem 2rem;display:flex;flex-direction:column;gap:1.4rem;
}
.turn{margin:0}
.turn .who{display:block;font-style:italic;font-size:15px;color:var(--ink-soft);margin-bottom:.15rem}
.turn .text{white-space:pre-wrap;margin:0;max-width:40rem}
.turn.doc .text{color:var(--ink)}
.turn.err .who{color:var(--signal)}
.turn.err .text{color:var(--signal);font-style:italic}
form{
  max-width:44rem;width:100%;margin:0 auto;padding:1rem 1.25rem 1.5rem;
  border-top:1px solid var(--rule);background:var(--paper);
  display:flex;gap:.8rem;align-items:flex-end;position:sticky;bottom:0;
}
textarea{
  flex:1;font:inherit;font-size:18px;line-height:1.5;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:.4rem 0;resize:none;min-height:2.4rem;max-height:10rem;outline:none;
}
textarea::placeholder{color:var(--ink-soft);font-style:italic}
textarea:focus{border-bottom-color:var(--ink)}
button{
  font:inherit;font-size:16px;background:none;color:var(--signal);
  border:0;border-bottom:1px solid currentColor;padding:.2rem 0;cursor:pointer;
}
button:hover{color:var(--ink)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
@media (max-width:520px){body{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.turn{animation:rise .4s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <p>An AI imitation. Doc is not a real person, and answers are generated by a model, not anyone's actual views. <a href="index.html">About Doc</a></p>
</header>

<div id="log" aria-live="polite"></div>

<form id="f">
  <label for="pass" style="position:absolute;left:-9999px">Passphrase</label>
  <input id="pass" type="password" placeholder="Passphrase" autocomplete="off" style="max-width:9rem;font:inherit;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--rule);padding:.4rem 0">
  <label for="q" style="position:absolute;left:-9999px">Message to Doc</label>
  <textarea id="q" rows="1" placeholder="Ask Doc about maths education" maxlength="2000" required></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("f");
const q = document.getElementById("q");
const send = document.getElementById("send");
const history = [];

function add(who, text, cls) {
  const d = document.createElement("div");
  d.className = "turn " + cls;
  const w = document.createElement("span");
  w.className = "who";
  w.textContent = who;
  const t = document.createElement("p");
  t.className = "text";
  t.textContent = text;
  d.append(w, t);
  log.appendChild(d);
  d.scrollIntoView({ block: "end" });
}

// Enter sends; Shift+Enter adds a line.
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
// Grow the box with the text.
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 160) + "px";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  q.style.height = "auto";
  add("You", text, "you");
  history.push({ role: "user", content: text });
  send.disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, passphrase: document.getElementById("pass").value }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    history.push({ role: "assistant", content: data.reply });
    add("Doc", data.reply, "doc");
  } catch (err) {
    history.pop();
    add("Error", err.message, "err");
  } finally {
    send.disabled = false;
    q.focus();
  }
});
</script>
</body>
</html>
