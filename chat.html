<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat with Doc</title>
<style>
:root{--bg:#fdfcf9;--fg:#1d1d1b;--mute:#6b6b66;--line:#e4e1d8;--accent:#8a3b12;--card:#f4f2ec;--me:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--fg:#e9e7e1;--mute:#9a978f;--line:#2e2d29;--accent:#e0915f;--card:#1f1e1b;--me:#2c2615}}
:root[data-theme="dark"]{--bg:#161614;--fg:#e9e7e1;--mute:#9a978f;--line:#2e2d29;--accent:#e0915f;--card:#1f1e1b;--me:#2c2615}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box}
.notice{background:var(--card);border-left:3px solid var(--accent);padding:10px 12px;font-size:14px;color:var(--mute);margin:0 0 12px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{padding:10px 12px;border-radius:8px;white-space:pre-wrap;max-width:90%}
.user{align-self:flex-end;background:var(--me)}
.bot{align-self:flex-start;background:var(--card)}
.err{color:var(--accent);font-size:14px}
form{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
textarea{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical;min-height:44px}
button{font:inherit;padding:0 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
a{color:var(--accent)}
</style>
</head>
<body>
<p class="notice"><strong>AI imitation.</strong> Doc is not a real person and answers are generated by a model. They aren't anyone's actual views. <a href="index.html">About Doc</a></p>
<div id="log"></div>
<form id="f">
  <textarea id="q" placeholder="Ask Doc something about maths education..." maxlength="2000" required></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("f");
const q = document.getElementById("q");
const send = document.getElementById("send");
const history = [];

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({ block: "end" });
}

q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  add(text, "user");
  history.push({ role: "user", content: text });
  send.disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    history.push({ role: "assistant", content: data.reply });
    add(data.reply, "bot");
  } catch (err) {
    history.pop();
    add(err.message, "err");
  } finally {
    send.disabled = false;
    q.focus();
  }
});
</script>
</body>
</html>
